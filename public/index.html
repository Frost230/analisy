
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embee Studio - Painel Global</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            padding: 2rem;
            text-align: center;
            border-bottom: 2px solid #333333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .github-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #ffffff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: #333333;
            transition: all 0.3s ease;
        }

        .github-link:hover {
            background: #444444;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .github-icon {
            width: 24px;
            height: 24px;
        }

        .dev-credit {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #888888;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .container {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid #222222;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .container h2 {
            margin-bottom: 1rem;
            color: #667eea;
            font-size: 1.5rem;
            border-bottom: 2px solid #333333;
            padding-bottom: 0.5rem;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .status-card {
            background: #111111;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #222222;
            text-align: center;
            transition: all 0.3s ease;
        }

        .status-card:hover {
            border-color: #667eea;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(102,126,234,0.2);
        }

        .status-card h3 {
            color: #888888;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .status-card p {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
        }

        .command-item {
            background: #111111;
            padding: 1rem;
            margin-bottom: 0.5rem;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .command-item:hover {
            background: #1a1a1a;
            transform: translateX(4px);
        }

        .command-type {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .type-chat {
            background: #1e3a5f;
            color: #60a5fa;
        }

        .type-command {
            background: #2d1f1f;
            color: #f97316;
        }

        .type-vote {
            background: #1f2d1f;
            color: #4ade80;
        }

        .command-meta {
            font-size: 0.8rem;
            color: #888888;
            margin-top: 0.25rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: #0a0a0a;
            border-top: 1px solid #222222;
            color: #555555;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🎮 Embee Studio</h1>
            <a href="https://github.com/Frost230/analisy" target="_blank" class="github-link">
                <svg class="github-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                GitHub
            </a>
        </div>
        <p class="dev-credit">Desenvolvido por frost230_0</p>
    </header>

    <main>
        <div class="container">
            <h2>📊 Status do Sistema</h2>
            <div class="status-grid">
                <div class="status-card">
                    <h3>Total de Eventos</h3>
                    <p id="totalEvents">0</p>
                </div>
                <div class="status-card">
                    <h3>Comandos Executados</h3>
                    <p id="totalCommands">0</p>
                </div>
                <div class="status-card">
                    <h3>Votações Realizadas</h3>
                    <p id="totalVotes">0</p>
                </div>
            </div>
        </div>

        <div class="container">
            <h2>📜 Histórico de Eventos</h2>
            <div id="historyContainer">
                <p style="color: #888888; text-align: center; padding: 2rem;">Aguardando eventos...</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Embee Studio. Todos os direitos reservados.</p>
    </footer>

    <script>
        let totalEvents = 0;
        let totalCommands = 0;
        let totalVotes = 0;

        async function fetchCommands() {
            try {
                const response = await fetch('/api/comandos');
                const data = await response.json();
                
                if (data.sucesso) {
                    updateUI(data.comandos);
                }
            } catch (error) {
                console.error('Erro ao buscar comandos:', error);
            }
        }

        function updateUI(commands) {
            const historyContainer = document.getElementById('historyContainer');
            
            if (commands.length === 0) {
                historyContainer.innerHTML = '<p style="color: #888888; text-align: center; padding: 2rem;">Aguardando eventos...</p>';
                return;
            }

            // Atualiza contadores
            totalEvents = commands.length;
            totalCommands = commands.filter(c => c.tipo === 'comando_global').length;
            totalVotes = commands.filter(c => c.tipo === 'vote_start').length;
            
            document.getElementById('totalEvents').textContent = totalEvents;
            document.getElementById('totalCommands').textContent = totalCommands;
            document.getElementById('totalVotes').textContent = totalVotes;

            // Renderiza histórico
            historyContainer.innerHTML = commands.slice(0, 50).map(event => {
                let typeClass = 'type-chat';
                let typeText = 'Chat';
                let content = '';

                if (event.tipo === 'comando_global') {
                    typeClass = 'type-command';
                    typeText = 'Comando';
                    content = event.acao || event.conteudo;
                } else if (event.tipo === 'vote_start') {
                    typeClass = 'type-vote';
                    typeText = 'Votação';
                    content = event.vote ? event.vote.question : 'Nova votação iniciada';
                } else if (event.tipo === 'vote_end') {
                    typeClass = 'type-vote';
                    typeText = 'Resultado';
                    content = event.results 
                        ? `${event.vote.option1}: ${event.results.option1}% | ${event.vote.option2}: ${event.results.option2}% (Total: ${event.results.total} votos)`
                        : 'Votação encerrada';
                } else {
                    content = event.conteudo;
                }

                const date = new Date(event.timestamp);
                const time = date.toLocaleTimeString('pt-BR');
                
                return `
                    <div class="command-item">
                        <div>
                            <span class="command-type ${typeClass}">${typeText}</span>
                            <div style="margin-top: 0.5rem;">
                                <strong>${event.player || 'Sistema'}:</strong> ${escapeHtml(content)}
                            </div>
                            <div class="command-meta">${time}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Atualiza a cada 1.5 segundos
        fetchCommands();
        setInterval(fetchCommands, 1500);
    </script>
</body>
</html>
