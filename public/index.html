
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embee Studio - Painel Global</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --bg-dark: #07090f;
            --bg-darker: #0a0a0a;
            --bg-card: #111111;
            --text-primary: #e7e9ef;
            --text-secondary: #888888;
            --border-color: #222222;
            --success-color: #4ade80;
            --warning-color: #f97316;
            --error-color: #ef4444;
            --info-color: #60a5fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 50%, var(--bg-dark) 100%));
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            backdrop-filter: blur(10px);
            padding: 2rem;
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            background: var(--primary-color);
            transition: all 0.3s ease;
            white-space: nowrap;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .github-link:hover {
            background: var(--secondary-color);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .github-icon {
            width: 24px;
            height: 24px;
        }

        .dev-credit {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .container {
            background: rgba(10, 10, 10, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container h2 {
            margin-bottom: 1rem;
            color: var(--text-primary);
            font-size: 1.75rem;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .container h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--primary-color);
            border-radius: 2px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .status-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.05) 100%);
            padding: 2rem;
            border-radius: 14px;
            border: 1px solid var(--primary-color);
            text-align: center;
            transition: all 0.3s ease;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.75rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .status-card:hover::before {
            left: 100%;
        }

        .status-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-8px);
            box-shadow: 0 12px 28px rgba(102, 126, 234, 0.25);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.1) 100%);
        }

        .status-card h3 {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .status-card p {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .command-item {
            background: rgba(17, 17, 17, 0.8);
            padding: 1.25rem 1.5rem;
            margin-bottom: 0.75rem;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: all 0.2s ease;
            gap: 1rem;
            border: 1px solid var(--border-color);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .command-item:hover {
            background: rgba(30, 30, 50, 0.9);
            transform: translateX(4px);
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .command-type {
            display: inline-block;
            padding: 0.35rem 0.85rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .type-chat {
            background: linear-gradient(135deg, #1e3a5f, #2d5a8c);
            color: var(--info-color);
        }

        .type-command {
            background: linear-gradient(135deg, #5f3a1e, #8c6a2d);
            color: var(--warning-color);
        }

        .type-vote {
            background: linear-gradient(135deg, #1f4d1f, #2d8c2d);
            color: var(--success-color);
        }

        .command-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.75rem;
        }

        .command-item strong {
            color: var(--primary-color);
        }

        footer {
            text-align: center;
            padding: 2rem 1.5rem;
            background: linear-gradient(180deg, var(--bg-darker), rgba(10, 10, 10, 0.8));
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            main {
                padding: 1rem;
            }

            .container {
                padding: 1.5rem;
            }

            .status-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 1.5rem;
            }
        }

        /* Scrollbar custom */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-darker);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Embee Studio</h1>
            <a href="https://github.com/Frost230/analisy" target="_blank" class="github-link">
                GitHub
            </a>
        </div>
        <p class="dev-credit">Desenvolvido por frost230_0</p>
    </header>

    <main>
        <div class="container">
            <h2>Status do Sistema</h2>
            <div class="status-grid">
                <div class="status-card">
                    <h3>Total de Eventos</h3>
                    <p id="totalEvents">0</p>
                </div>
                <div class="status-card">
                    <h3>Comandos Executados</h3>
                    <p id="totalCommands">0</p>
                </div>
                <div class="status-card">
                    <h3>Votações Realizadas</h3>
                    <p id="totalVotes">0</p>
                </div>
            </div>
        </div>

        <div class="container">
            <h2>Histórico de Eventos</h2>
            <div id="historyContainer">
                <p style="color: #888888; text-align: center; padding: 2rem;">Aguardando eventos...</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Embee Studio. Todos os direitos reservados.</p>
    </footer>

    <script>
        let totalEvents = 0;
        let totalCommands = 0;
        let totalVotes = 0;
        let lastUpdate = 0;
        const UPDATE_INTERVAL = 1500;

        async function fetchCommands() {
            try {
                const response = await fetch('/api/comandos', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const data = await response.json();

                if (data.sucesso && Array.isArray(data.comandos)) {
                    updateUI(data.comandos);
                    lastUpdate = Date.now();
                }
            } catch (error) {
                console.error('Erro ao buscar comandos:', error);
                showErrorMessage();
            }
        }

        function updateUI(commands) {
            const historyContainer = document.getElementById('historyContainer');

            if (!commands || commands.length === 0) {
                historyContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>Aguardando eventos...</p>
                        <p style="font-size: 0.85rem; margin-top: 0.5rem;">O painel atualizará automaticamente a cada 1.5 segundos</p>
                    </div>
                `;
                resetCounters();
                return;
            }

            try {
                // Atualiza contadores
                totalEvents = commands.length;
                totalCommands = commands.filter(c => c.tipo === 'comando_global').length;
                totalVotes = commands.filter(c => c.tipo === 'vote_start').length;

                document.getElementById('totalEvents').textContent = totalEvents;
                document.getElementById('totalCommands').textContent = totalCommands;
                document.getElementById('totalVotes').textContent = totalVotes;

                // Renderiza histórico (últimos 50 eventos)
                historyContainer.innerHTML = commands.slice(0, 50).map(event => {
                    let typeClass = 'type-chat';
                    let typeText = 'Chat';
                    let content = '';

                    if (event.tipo === 'comando_global') {
                        typeClass = 'type-command';
                        typeText = 'Comando';
                        content = event.acao || event.conteudo || 'Comando executado';
                    } else if (event.tipo === 'vote_start') {
                        typeClass = 'type-vote';
                        typeText = 'Votação';
                        content = event.vote ? event.vote.question : 'Nova votação iniciada';
                    } else if (event.tipo === 'vote_end') {
                        typeClass = 'type-vote';
                        typeText = 'Resultado';
                        if (event.results && event.vote) {
                            content = `${event.vote.option1}: ${event.results.option1}% | ${event.vote.option2}: ${event.results.option2}% (Total: ${event.results.total} votos)`;
                        } else {
                            content = 'Votação encerrada';
                        }
                    } else {
                        content = event.conteudo || 'Evento desconhecido';
                    }

                    const date = new Date(event.timestamp);
                    const time = date.toLocaleTimeString('pt-BR');

                    return `
                        <div class="command-item">
                            <div style="flex: 1;">
                                <span class="command-type ${typeClass}">${typeText}</span>
                                <div style="margin-top: 0.5rem;">
                                    <strong>${escapeHtml(event.player || 'Sistema')}:</strong> ${escapeHtml(content)}
                                </div>
                                <div class="command-meta">🕐 ${time}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Erro ao atualizar UI:', error);
                showErrorMessage();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function showErrorMessage() {
            const historyContainer = document.getElementById('historyContainer');
            if (historyContainer && !historyContainer.querySelector('.empty-state')) {
                console.warn('Erro ao conectar com o servidor. Verifique sua conexão.');
            }
        }

        function resetCounters() {
            document.getElementById('totalEvents').textContent = '0';
            document.getElementById('totalCommands').textContent = '0';
            document.getElementById('totalVotes').textContent = '0';
        }

        // Inicializa
        document.addEventListener('DOMContentLoaded', () => {
            fetchCommands();
            setInterval(fetchCommands, UPDATE_INTERVAL);
        });

        // Fallback caso DOMContentLoaded não dispare
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                fetchCommands();
                setInterval(fetchCommands, UPDATE_INTERVAL);
            });
        } else {
            fetchCommands();
            setInterval(fetchCommands, UPDATE_INTERVAL);
        }
    </script>
</body>
</html>
